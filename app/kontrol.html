<!doctype html>

     Açılmayan telefonlar için kontrol sayfası: uygulamayı içeride açmayı dener, ne olduğunu ekrana yazar
     ve geliştiriciye kaydeder (ad, e-posta, not gönderilmez). Bilerek eski JavaScript ile yazıldı. -->
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Ders Özetim · Kontrol</title>
<style>
  body{margin:0;background:#F4F1FB;color:#261E3A;font:16px/1.5 system-ui,-apple-system,Roboto,sans-serif}
  main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
  h1{font-size:22px;margin:0 0 6px}
  p{margin:0 0 12px}
  .box{background:#fff;border:1px solid #E4DDF3;border-radius:16px;padding:14px 16px;margin:14px 0}
  .row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid #F0ECF8;font-size:14px}
  .row:last-child{border-bottom:0}
  .row b{flex:none}
  .row span{text-align:right;word-break:break-word}
  .ok{color:#2E8F64}.no{color:#C2364F}
  .big{font-size:18px;font-weight:700}
  button,a.btn{display:inline-block;font:600 16px system-ui,sans-serif;padding:12px 18px;border-radius:12px;border:0;background:#6A4BD6;color:#fff;text-decoration:none;margin:6px 6px 0 0}
  button.ghost{background:#fff;color:#261E3A;border:1px solid #CFC6EE}
  iframe{width:1px;height:1px;border:0;position:absolute;left:-9999px}
  code{font-size:12px;word-break:break-all}
</style>
</head>
<body>
<main>
  <h1>Ders Özetim kontrol</h1>
  <p>Bu sayfa uygulamanın bu telefonda neden açılmadığını bulur. Yaklaşık 15 saniye sürer, bekle.</p>
  <div class="box"><div id="sum" class="big">Kontrol ediliyor…</div><div id="code" style="margin-top:6px;font-size:13px;color:#6A6184"></div></div>
  <div class="box" id="rows"></div>
  <div>
    <button id="fix">Temizle ve uygulamayı aç</button>
    <a class="btn" href="./" style="background:#fff;color:#261E3A;border:1px solid #CFC6EE">Uygulamayı aç</a>
  </div>
  <p style="margin-top:18px;font-size:13px;color:#6A6184">Sonuç bana otomatik geldi. İstersen bu ekranın görüntüsünü de at.</p>
</main>
<iframe id="fr" title="deneme"></iframe>
<script>
(function(){
  var R = {}, rows = document.getElementById('rows');
  function row(k, v, good){
    R[k] = v;
    var d = document.createElement('div'); d.className = 'row';
    var b = document.createElement('b'); b.appendChild(document.createTextNode(k));
    var s = document.createElement('span'); s.appendChild(document.createTextNode(String(v)));
    if (good === true) s.className = 'ok'; if (good === false) s.className = 'no';
    d.appendChild(b); d.appendChild(s); rows.appendChild(d);
  }
  function can(src){ try { new Function(src); return true; } catch(e){ return false; } }
  var ua = navigator.userAgent, m = ua.match(/(Chrome|CriOS|Version|SamsungBrowser|HeyTapBrowser|OppoBrowser|Firefox)\/([\d.]+)/);
  row('Tarayıcı', m ? m[1] + ' ' + m[2] : '?');
  var andr = ua.match(/Android [\d.]+/), ios = ua.match(/OS (\d+_\d+)/);
  row('Sistem', andr ? andr[0] : ios ? 'iOS ' + ios[1].replace('_', '.') : navigator.platform);
  row('Uygulama içi tarayıcı', /Instagram|FBAN|FBAV|WhatsApp|; wv\)/.test(ua) ? 'evet' : 'hayır');
  var modern = can('class A{#a(){return 1}b(){return this.#a()}};var x;x||=1;return ({}).b?.c??1');
  var asyn = can('async function f(){await 0}');
  row('Yeni JavaScript', modern ? 'var' : 'yok, eski kopya kullanılır', modern ? true : null);
  row('async desteği', asyn ? 'var' : 'yok', asyn);
  row('Ekran', screen.width + 'x' + screen.height + ' · dpr ' + (window.devicePixelRatio || 1));
  var dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  row('Koyu tema', dark ? 'açık' : 'kapalı');
  var ls = false; try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); ls = true; } catch(e){}
  row('Yerel kayıt (localStorage)', ls ? 'çalışıyor' : 'çalışmıyor', ls);
  var swc = !!(navigator.serviceWorker && navigator.serviceWorker.controller);
  row('Çevrimdışı çalışan', navigator.serviceWorker ? (swc ? 'aktif' : 'kurulu değil') : 'desteklenmiyor');
  row('İnternet', navigator.onLine ? 'var' : 'yok', navigator.onLine);

  var done = false;
  function send(){
    try {
      var x = new XMLHttpRequest();
      x.open('POST', 'https://gwmetoexnklzdyzrvgdv.supabase.co/rest/v1/client_logs');
      x.setRequestHeader('apikey', 'sb_publishable_jwY5M8lzep4mvJoqUQQbzQ_scsnOrDK');
      x.setRequestHeader('content-type', 'application/json'); x.setRequestHeader('prefer', 'return=minimal');
      x.onload = function(){ document.getElementById('code').appendChild(document.createTextNode(x.status < 300 ? 'Sonuç gönderildi.' : 'Sonuç gönderilemedi (' + x.status + ').')); };
      x.onerror = function(){ document.getElementById('code').appendChild(document.createTextNode('Sonuç gönderilemedi: sunucuya ulaşılamadı.')); };
      x.send(JSON.stringify({ kind: 'check', ver: /^\d/.test(R['Uygulama sürümü'] || '') ? R['Uygulama sürümü'] : '', ua: ua.slice(0, 300), data: R }));
    } catch(e){}
  }
  function finish(sum, good){
    if (done) return; done = true;
    var s = document.getElementById('sum'); s.textContent = sum; s.className = 'big ' + (good ? 'ok' : 'no');
    send();
  }

  // dosyalar sunucudan geliyor mu
  function head(p, cb){
    try {
      var x = new XMLHttpRequest(); x.open('GET', p + (p.indexOf('?') < 0 ? '?' : '&') + 'k=' + Date.now());
      x.onload = function(){ cb(x.status, (x.responseText || '').length); }; x.onerror = function(){ cb(0, 0); }; x.send();
    } catch(e){ cb(-1, 0); }
  }
  head('index.html', function(st, n){ row('Uygulama sayfası', st === 200 ? 'geldi (' + Math.round(n / 1024) + ' KB)' : 'gelmedi (' + st + ')', st === 200); });
  head(modern ? 'vendor/supabase.min.js' : 'legacy/vendor/supabase.min.js', function(st, n){ row('Giriş kütüphanesi', st === 200 ? 'geldi (' + Math.round(n / 1024) + ' KB)' : 'gelmedi (' + st + ')', st === 200); });
  head('https://gwmetoexnklzdyzrvgdv.supabase.co/auth/v1/health', function(st){ row('Sunucu (Supabase)', st ? 'ulaşılıyor' : 'ulaşılamıyor', !!st); });

  // uygulamayı görünmez bir çerçevede aç, ne olduğuna bak
  var fr = document.getElementById('fr'), t0 = Date.now(), errs = [];
  fr.onload = function(){
    var w = fr.contentWindow;
    try { w.addEventListener('error', function(e){ errs.push((e.message || 'dosya yüklenemedi') + (e.filename ? ' @' + String(e.filename).split('/').pop() + ':' + e.lineno : e.target && e.target.src ? ' @' + String(e.target.src).split('/').pop() : '')); }, true); } catch(e){}
  };
  fr.src = './?nosw&kontrol=' + Date.now();
  var tries = 0;
  var iv = setInterval(function(){
    tries++;
    var w, d; try { w = fr.contentWindow; d = w.document; } catch(e){ clearInterval(iv); row('Deneme', 'çerçeveye erişilemedi'); finish('Bilinmeyen sorun', false); return; }
    if (!w || !d) return;
    var ready = !!w.__DO_READY;
    if (!ready && tries < 24) return;
    clearInterval(iv);
    var diag = w.__diag || {}, mk = diag.m || {};
    var ver = ''; try { ver = w.eval("typeof APP !== 'undefined' ? APP.version : ''"); } catch(e){}
    row('Uygulama sürümü', ver || 'yüklenmedi', !!ver);
    row('Eski kopya kullanıldı', w.__DO_LEGACY ? 'evet' : 'hayır');
    row('Uygulama açıldı', ready ? 'evet, ' + ((mk.ready || (Date.now() - t0)) / 1000).toFixed(1) + ' sn' : 'hayır', ready);
    var app = d.getElementById('app'), txt = app ? (app.innerText || app.textContent || '').replace(/\s+/g, ' ').slice(0, 90) : '(yok)';
    row('Ekrandaki yazı', txt || '(boş)', !!txt);
    if (app && w.getComputedStyle){
      var cs = w.getComputedStyle(app), bs = w.getComputedStyle(d.body);
      R['Renkler'] = 'yazı ' + cs.color + ' · zemin ' + bs.backgroundColor + ' · görünür ' + cs.visibility + '/' + cs.display + '/' + cs.opacity;
      row('Renkler', R['Renkler']);
    }
    var all = errs.concat(diag.errs || []);
    row('Hatalar', all.length ? all.slice(0, 4).join(' | ') : 'yok', !all.length);
    R.marks = JSON.stringify(mk);
    if (!ready) finish('Uygulama bu telefonda açılamadı. Sebebi aşağıda; bana da geldi.', false);
    else if (!txt) finish('Uygulama çalışıyor ama ekran boş görünüyor. Bilgiler bana geldi.', false);
    else finish('Uygulama bu telefonda açılabiliyor. "Temizle ve uygulamayı aç"a bas.', true);
  }, 500);

  document.getElementById('fix').onclick = function(){
    var jobs = [];
    try { if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){ return Promise.all(rs.map(function(r){ return r.unregister(); })); })); } catch(e){}
    try { if (window.caches) jobs.push(caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){ return caches.delete(k); })); })); } catch(e){}
    var go = function(){ location.href = './?t=' + Date.now(); };
    if (window.Promise && jobs.length) Promise.all(jobs).then(go, go); else go();
  };
})();
</script>
</body>
</html>
