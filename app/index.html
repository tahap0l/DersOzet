<script>
/* Açılış bekçisi: uygulama 12 saniyede açılmazsa ya da bir dosya çalışmazsa "Yükleniyor…"da takılı
   kalmak yerine sebebini ve onarma düğmesini gösterir. Notların silinmez.
   Açılış kaydı: takılan ya da yavaş açılan cihazda tarayıcı bilgisi, hata ve hangi adımda takıldığı
   sunucuya kaydedilir (ad, e-posta ya da içerik gönderilmez); geliştirici sorunu buradan bulur. */
(function(){
  var errs = [], shown = false;
  var D = window.__diag = { m: {}, errs: errs, sent: 0,
    mark: function(k){ if (!(k in D.m)) D.m[k] = Math.round(performance.now()); },
    send: function(kind, extra){
      try {
        if (D.sent >= 6) return; D.sent++;
        var C = window.DO_CONFIG || {}, sa = !!(navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches));
        var cn = navigator.connection || {}, data = { m: D.m, errs: errs.slice(0, 5), now: Math.round(performance.now()), sa: sa,
          sw: !!(navigator.serviceWorker && navigator.serviceWorker.controller), on: navigator.onLine, net: cn.effectiveType || '',
          scr: screen.width + 'x' + screen.height, lg: !!window.__DO_LEGACY, page: (location.hash || '').split('/')[1] || '' };
        if (extra) for (var k in extra) data[k] = extra[k];
        fetch((C.supabaseUrl || 'https://gwmetoexnklzdyzrvgdv.supabase.co') + '/rest/v1/client_logs', { method: 'POST', keepalive: true,
          headers: { apikey: C.supabaseKey || 'sb_publishable_jwY5M8lzep4mvJoqUQQbzQ_scsnOrDK', 'content-type': 'application/json', prefer: 'return=minimal' },
          body: JSON.stringify({ kind: kind, ver: typeof APP !== 'undefined' ? APP.version : '', ua: navigator.userAgent.slice(0, 300), data: data }) }).catch(function(){});
      } catch(e){}
    } };
  D.mark('html');
  document.addEventListener('DOMContentLoaded', function(){ D.mark('dom'); });
  function can(src){ try { new Function(src); return true; } catch(e){ return false; } }
  // Uygulama ve Supabase bu yazımları kullanır. Tanımayan tarayıcı (iOS 14 ve öncesi, eski Android Chrome)
  // app/legacy'deki çevrilmiş kopyayı yükler (denemek için adrese ?legacy=1); async bile bilmeyen tarayıcıya "çok eski" denir.
  window.__DO_LEGACY = /[?&]legacy=1/.test(location.search) || !can('class A{#a(){return 1}b(){return this.#a()}};var x;x||=1;return ({}).b?.c??1');
  function old(){ return !can('async function f(){await 0}'); }
  function show(kind){
    if (shown || window.__DO_READY || (kind === 'err' && window.__DO_OK)) return; shown = true;
    D.send('stuck', { why: kind });
    var a = document.getElementById('app'); if (!a) return;
    var msg = kind === 'old' ? 'Bu tarayıcı Ders Özetim için çok eski. Telefonun güncellemelerini yap ya da Chrome\'u güncelle ve tekrar dene.'
      : kind === 'err' ? 'Uygulama açılırken bir sorun çıktı. Aşağıdaki düğme kayıtlı dosyaları temizleyip yeniden indirir; notların ve programın silinmez.'
      : 'Açılış uzun sürüyor. İnternetin yavaş olabilir. Biraz daha bekleyebilir ya da onarıp yeniden deneyebilirsin; notların ve programın silinmez.';
    a.innerHTML = '<div style="max-width:420px;margin:12vh auto;padding:0 20px;font:16px/1.5 system-ui,sans-serif;color:#2a2340">'
      + '<h1 style="font-size:22px;margin:0 0 8px">Ders Özetim açılamadı</h1><p style="margin:0 0 18px">' + msg + '</p>'
      + (kind === 'old' ? '' : '<button onclick="__doFix()" style="font:600 16px system-ui;padding:12px 18px;border:0;border-radius:12px;background:#6c4cf1;color:#fff">Onar ve yeniden aç</button> '
      + '<button onclick="location.reload()" style="font:600 16px system-ui;padding:12px 18px;border:1px solid #cfc6ee;border-radius:12px;background:#fff;color:#2a2340">Tekrar dene</button>')
      + (errs.length ? '<p style="margin-top:22px;font-size:12px;color:#6b6585;word-break:break-word">Hata: ' + errs.slice(0, 2).join(' | ').replace(/[<>&]/g, '') + '</p>' : '')
      + '</div>';
  }
  window.__doFix = function(){
    var jobs = [];
    try { if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){ return Promise.all(rs.map(function(r){ return r.unregister(); })); })); } catch(e){}
    try { if (window.caches) jobs.push(caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){ return caches.delete(k); })); })); } catch(e){}
    Promise.all(jobs).catch(function(){}).then(function(){ location.reload(); });
  };
  var later = 0;
  window.addEventListener('unhandledrejection', function(e){
    var r = e.reason, t = String(r && (r.message || r) || '').slice(0, 200);
    if (!t || /abort|network|fetch|load failed|cancel/i.test(t)) return;
    if (window.__DO_READY){ if (later++ < 3) D.send('error', { rej: t }); return; }
    errs.push('promise: ' + t);
  });
  window.addEventListener('error', function(e){
    if (window.__DO_OK){ if (e.message && later++ < 3) D.send('error', { msg: String(e.message).slice(0, 200), at: String(e.filename || '').split('/').pop() + ':' + e.lineno }); return; }
    errs.push((e.message || 'dosya yüklenemedi') + (e.filename ? ' (' + String(e.filename).split('/').pop() + ':' + e.lineno + ')' : e.target && e.target.src ? ' (' + String(e.target.src).split('/').pop() + ')' : ''));
    setTimeout(function(){ show('err'); }, 2500);
  }, true);
  if (old()) { window.__DO_OLD = true; document.addEventListener('DOMContentLoaded', function(){ show('old'); }); return; }
  setTimeout(function(){ show('slow'); }, 12000);
  // açılmadan sayfadan çıkan (beyaz ekranda bekleyip kapatan) cihazı da kaydet
  document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'hidden' && !window.__DO_READY) D.send('left', { app: !!document.querySelector('#app .hint') }); });
  // yavaş açılış: 5 saniyeyi geçen açılışı kaydet; ayrıca her cihazdan sürüm başına bir örnek
  window.addEventListener('load', function(){ setTimeout(function(){
    var r = D.m.ready, v = ''; try { v = localStorage.getItem('dersozetim.diag') || ''; } catch(e){}
    var ver = typeof APP !== 'undefined' ? APP.version : '';
    if (r && r > 5000) D.send('slow');
    else if (r && v !== ver){ D.send('boot'); try { localStorage.setItem('dersozetim.diag', ver); } catch(e){} }
  }, 15000); });
})();
</script>
</head>
<body>
<main id="app" aria-live="polite"><p class="hint">Yükleniyor…</p></main>
<nav id="tabbar" class="tabbar" aria-label="Ana menü" hidden></nav>
<div id="room-audio" hidden></div>
<aside id="mplayer" class="mplayer" aria-label="Oynatıcı" hidden></aside>
<input type="file" id="file-xlsx" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" multiple hidden>
<input type="file" id="file-json" accept=".json,application/json" hidden>
<input type="file" id="file-xlsx-sc" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" multiple hidden>
<div class="toast-wrap"><div class="toast" id="toast" role="status" aria-live="polite"></div></div>
<noscript><p style="padding:20px">Ders Özetim'in çalışması için JavaScript gerekir.</p></noscript>
<script>
/* Dosyalar sırayla yüklenir. Eski tarayıcıda (bkz. açılış bekçisi) app/legacy'deki çevrilmiş kopyalar kullanılır. */
(function(){
  if (window.__DO_OLD) return;
  var L = window.__DO_LEGACY, f = ['js/config.js', 'vendor/supabase.min.js', 'vendor/fflate.min.js', 'js/core.js', 'js/motivation.js', 'js/ai.js', 'js/pdf.js', 'js/cloud.js', 'js/app.js', 'js/mascot.js', 'js/school.js', 'js/rooms.js', 'js/spotify.js', 'js/media.js', 'js/admin.js', 'js/notes.js', 'js/install.js', 'js/chat.js', 'js/youtube.js', 'js/plan.js', 'js/lab.js', 'js/sims-fizik.js', 'js/sims-kimya.js', 'js/sims-mat.js', 'js/main.js'];
  if (L) document.write('<script src="legacy/polyfill.js"><\/script>');
  for (var i = 0; i < f.length; i++){
    var p = f[i], src = L && (/^js\//.test(p) || p === 'vendor/supabase.min.js') && p !== 'js/config.js' ? 'legacy/' + p : p;
    document.write('<script src="' + src + '"><\/script>');
  }
})();
</script>
</body>
</html>
